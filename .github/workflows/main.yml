name: Testes de API
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Rodar a coleção de testes
        run: npm test
      - name: Guardar relatórios Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-newman
          path: evidencias/
          if-no-files-found: warn
